services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: burnish
      POSTGRES_USER: burnish
      POSTGRES_PASSWORD: burnish_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U burnish"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build: .
    command: python -m services.workers.main
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://burnish:burnish_dev@postgres:5432/burnish
      REDIS_URL: redis://redis:6379
    restart: unless-stopped

volumes:
  pgdata:
